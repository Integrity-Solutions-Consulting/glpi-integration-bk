services:
  revision:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SYNC_DATA_DIR: /app/data
      SYNC_MODE: ${SYNC_MODE:-REAL}
      PILOT_TMR_USER_ID: ${PILOT_TMR_USER_ID:-}
    command: node src/app.mjs
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    volumes:
      - tmr_glpi_sync_data:/app/data

  transferencia:
    extends:
      service: revision
    command: node src/transfer.mjs

  automatizacion:
    extends:
      service: revision
    command: node src/auto-sync.mjs
    environment:
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-5}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-}
      SYNC_MAX_WRITES: ${SYNC_MAX_WRITES:-1000}
      EQUIPMENT_MAX_WRITES: ${EQUIPMENT_MAX_WRITES:-1000}
      EQUIPMENT_DETAIL_MAX_WRITES: ${EQUIPMENT_DETAIL_MAX_WRITES:-1000}
    restart: unless-stopped

volumes:
  tmr_glpi_sync_data:
